[build]
  publish = "."

# Eski, platformani chetlab o'tuvchi /test sahifasi olib tashlandi.
# Test endi faqat index.html ichida, o'qituvchi ruxsati bilan ochiladi.
[[redirects]]
  from = "/test/*"
  to = "/index.html"
  status = 301

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"
