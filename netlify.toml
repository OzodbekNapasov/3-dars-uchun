[build]
  publish = "."

# SPA yagona sahifa marshrutizatsiyasi: /test yoki boshqa istalgan havola index.html ga yo'naltiriladi
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"
